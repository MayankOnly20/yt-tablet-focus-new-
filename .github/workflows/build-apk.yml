name: Build YouTube Tablet APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract uBlock Origin and Unhook
        run: |
          mkdir -p app/src/main/assets/extensions/ublock
          mkdir -p app/src/main/assets/extensions/unhook
          curl -fsSL -A "Mozilla/5.0" -o ublock.xpi "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
          curl -fsSL -A "Mozilla/5.0" -o unhook.xpi "https://addons.mozilla.org/firefox/downloads/latest/youtube-recommended-videos/latest.xpi"
          unzip -q ublock.xpi -d app/src/main/assets/extensions/ublock
          unzip -q unhook.xpi -d app/src/main/assets/extensions/unhook
          rm -f ublock.xpi unhook.xpi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Focus-Tablet-APK
          path: app/build/outputs/apk/debug/app-debug.apk
